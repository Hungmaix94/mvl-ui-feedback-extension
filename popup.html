<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SnapUI — Visual Feedback</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="popup-shell">
    <!-- Top Bar: Brand + One-Time QA/DEV Switch -->
    <header class="popup-header">
      <div class="brand-group">
        <div class="brand-icon" aria-hidden="true">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2v14a2 2 0 0 0 2 2h14"/>
            <path d="M18 22V8a2 2 0 0 0-2-2H2"/>
          </svg>
        </div>
        <span class="brand-name">SnapUI</span>
        <span id="mcp-status-badge" class="status-dot" title="Online"></span>
        <span class="slackbot-badge" id="slackbot-header-badge" title="AI Slackbot Engine Connected (50,404 RAG chunks · Auto-Enrich)">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="11" width="18" height="10" rx="2"/>
            <circle cx="12" cy="5" r="2"/>
            <path d="M12 7v4"/>
            <line x1="8" y1="16" x2="8" y2="16"/>
            <line x1="16" y1="16" x2="16" y2="16"/>
          </svg>
          <span>AI Slackbot</span>
        </span>
      </div>

      <div class="role-pill-switch" role="radiogroup" aria-label="Working Role">
        <button
          type="button"
          id="btn-mode-qa"
          class="role-pill active"
          role="radio"
          aria-checked="true"
          tabindex="0"
          title="QA Mode: Create Plane Issues"
        >
          QA
        </button>
        <button
          type="button"
          id="btn-mode-dev"
          class="role-pill"
          role="radio"
          aria-checked="false"
          tabindex="-1"
          title="DEV Mode: Send to AI MCP"
        >
          DEV
        </button>
      </div>
    </header>

    <!-- Primary Capture CTA -->
    <section class="capture-bar" aria-label="Capture actions">
      <button type="button" id="btn-start-crop" class="btn-capture-primary qa">
        <span class="btn-capture-left">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2v14a2 2 0 0 0 2 2h14"/>
            <path d="M18 22V8a2 2 0 0 0-2-2H2"/>
          </svg>
          <span id="btn-start-crop-label">Crop &amp; Create Issue</span>
        </span>
        <kbd class="btn-kbd">⌥⇧C</kbd>
      </button>

      <button type="button" id="btn-start-video" class="btn-capture-video" title="Record video clip">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="23 7 16 12 23 17 23 7"/>
          <rect width="15" height="14" x="1" y="5" rx="2" ry="2"/>
        </svg>
      </button>
    </section>

    <!-- Compact Pill Tabs -->
    <nav class="segmented-tabs" role="tablist" aria-label="Sections">
      <button
        type="button"
        id="tab-btn-project"
        class="tab-btn active"
        data-tab="tab-project"
        role="tab"
        aria-selected="true"
        aria-controls="tab-project"
        tabindex="0"
      >
        Context
      </button>
      <button
        type="button"
        id="tab-btn-plane"
        class="tab-btn"
        data-tab="tab-plane"
        role="tab"
        aria-selected="false"
        aria-controls="tab-plane"
        tabindex="-1"
      >
        Settings
      </button>
      <button
        type="button"
        id="tab-btn-history"
        class="tab-btn"
        data-tab="tab-history"
        role="tab"
        aria-selected="false"
        aria-controls="tab-history"
        tabindex="-1"
      >
        History
      </button>
    </nav>

    <!-- TAB 1: Minimal Context -->
    <section id="tab-project" class="tab-panel active" role="tabpanel" aria-labelledby="tab-btn-project">
      <div class="url-preview-bar">
        <span id="detected-env-pill" class="env-pill DEV-ONL">DEV</span>
        <span id="detected-url-text" class="detected-url">Detecting URL...</span>
        <span class="slackbot-pill" id="slackbot-url-pill" title="AI Slackbot Telemetry Ready">AI Slackbot</span>
      </div>

      <div class="form-grid-2">
        <div class="field-group">
          <label for="select-default-project">Project</label>
          <select id="select-default-project"></select>
        </div>
        <div class="field-group">
          <label for="select-default-module">Module</label>
          <select id="select-default-module"></select>
        </div>
      </div>

      <details class="projects-expander">
        <summary class="expander-summary">
          <span>Filter projects</span>
          <div class="card-actions-inline">
            <button type="button" id="btn-toggle-add-project" class="btn-ghost-link">+ Add</button>
            <button type="button" id="btn-select-all-projects" class="btn-ghost-link">All</button>
          </div>
        </summary>

        <div id="add-project-drawer" class="add-project-drawer" style="display: none;">
          <div class="form-grid-2">
            <input type="text" id="input-new-proj-code" placeholder="Key (WEB)" />
            <input type="text" id="input-new-proj-name" placeholder="Name" />
          </div>
          <div class="add-proj-row-bottom">
            <input type="text" id="input-new-proj-id" placeholder="UUID (optional)" />
            <button type="button" id="btn-save-new-project" class="btn-save-mini">Save</button>
          </div>
        </div>

        <div id="project-checklist" class="project-chip-grid"></div>
      </details>
    </section>

    <!-- TAB 2: Settings (Plane & MCP) -->
    <section id="tab-plane" class="tab-panel" role="tabpanel" aria-labelledby="tab-btn-plane" hidden>
      <div class="account-card" id="plane-account-banner">
        <div class="account-avatar" id="account-avatar-initials">PH</div>
        <div class="account-meta">
          <span id="account-name-text" class="account-name">Connected</span>
          <span id="account-email-text" class="account-email">Default PAT</span>
        </div>
        <span class="verified-tag">Active</span>
      </div>

      <div class="field-group">
        <label for="input-plane-pat">Plane PAT</label>
        <input type="password" id="input-plane-pat" placeholder="plane_api_..." autocomplete="off" />
      </div>

      <div class="form-grid-2">
        <div class="field-group">
          <label for="input-plane-host">Host</label>
          <input type="text" id="input-plane-host" value="https://pm.glinteco.com" />
        </div>
        <div class="field-group">
          <label for="input-plane-workspace">Workspace</label>
          <input type="text" id="input-plane-workspace" value="glinteco" />
        </div>
      </div>

      <button type="button" id="btn-sync-plane" class="btn-sync-action">
        <span id="btn-sync-plane-label">Sync Plane</span>
      </button>

      <div class="mcp-inline-row">
        <input
          type="text"
          id="input-mcp-url"
          class="mcp-readonly-input"
          readonly
          value="https://mvl-ui-feedback-mcp.warhorses94.workers.dev/mcp"
        />
        <button type="button" id="btn-copy-mcp" class="btn-ghost-link">Copy MCP</button>
      </div>
    </section>

    <!-- TAB 3: History -->
    <section id="tab-history" class="tab-panel" role="tabpanel" aria-labelledby="tab-btn-history" hidden>
      <div class="history-toolbar">
        <span class="card-title">Recent</span>
        <button type="button" id="btn-refresh-history" class="btn-ghost-link">Refresh</button>
      </div>
      <div id="history-list" class="history-feed">
        <div class="empty-state">Loading...</div>
      </div>
    </section>

    <!-- Minimal Footer -->
    <footer class="popup-footer">
      <label class="toggle-row">
        <input type="checkbox" id="chk-floating-pill" checked />
        <span class="toggle-track"><span class="toggle-thumb"></span></span>
        <span class="toggle-label">Floating button</span>
      </label>
      <span id="status-msg" class="status-toast" role="status" aria-live="polite"></span>
    </footer>
  </main>

  <script src="default-config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
